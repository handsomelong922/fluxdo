name: Build and Release

on:
  push:
    branches:
      - codex/rollback-to-v0.3.1

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Calculate next release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next-tag.outputs.tag }}
      version: ${{ steps.next-tag.outputs.version }}
      previous_tag: ${{ steps.next-tag.outputs.previous_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate next patch tag
        id: next-tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          latest_tag=$(git tag -l 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          previous_tag="$latest_tag"

          if [[ -z "$latest_tag" ]]; then
            latest_tag="v0.0.0"
          fi

          version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$version"
          next_tag="v${major}.${minor}.$((patch + 1))"

          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "version=${next_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.next-tag.outputs.tag }}"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on origin."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$tag" -m "Release $tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

  build:
    needs:
      - version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # CUSTOM: Keyword Filter 精简构建矩阵 - 保留 Android arm64-v8a 与 Windows x86_64
          - platform: android
            os: ubuntu-latest
            arch: arm64-v8a
            rust-target: aarch64-linux-android
            flutter-target: android-arm64
          - platform: windows
            os: windows-2022
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        if: startsWith(matrix.platform, 'android')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          cache: true

      - name: Setup Rust
        if: startsWith(matrix.platform, 'android') || matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Android build environment
        if: startsWith(matrix.platform, 'android')
        run: |
          rustup target add ${{ matrix.rust-target }}
          cargo install cargo-ndk
          sudo apt-get update && sudo apt-get install -y cmake

      - name: Setup Android NDK
        if: startsWith(matrix.platform, 'android')
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.2.9519653'

      - name: Configure Keystore
        if: startsWith(matrix.platform, 'android')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > android/app/key.jks
          echo "storePassword=$STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=../app/key.jks" >> android/key.properties

      - name: Inject dummy google-services.json
        if: startsWith(matrix.platform, 'android')
        run: |
          echo '{"project_info":{"project_number":"123","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"com.github.lingyan000.fluxdo"}},"api_key":[{"current_key":"dummy"}]}],"configuration_version":"1"}' > android/app/google-services.json

      - name: Generate CA certificates
        if: startsWith(matrix.platform, 'android') || matrix.platform == 'windows'
        working-directory: core/doh_proxy
        run: cargo run --bin gen_ca

      - name: Build DOH Proxy
        if: startsWith(matrix.platform, 'android')
        working-directory: core/doh_proxy
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/25.2.9519653
        run: cargo ndk -t ${{ matrix.arch }} --platform 28 build --release --features ech

      - name: Copy native libraries
        if: startsWith(matrix.platform, 'android')
        run: |
          mkdir -p android/app/src/main/jniLibs/${{ matrix.arch }}
          cp core/doh_proxy/target/${{ matrix.rust-target }}/release/libdoh_proxy.so android/app/src/main/jniLibs/${{ matrix.arch }}/
          mkdir -p android/app/src/main/res/raw
          cp core/doh_proxy/certs/ca.der android/app/src/main/res/raw/proxy_ca.der

      - name: Generate l10n
        run: bash scripts/gen_l10n.sh --merge

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android
        if: startsWith(matrix.platform, 'android')
        run: |
          flutter build apk --release --target-platform ${{ matrix.flutter-target }} --dart-define=cronetHttpNoPlay=true --dart-define=appNetworkProfile=full
          mkdir -p dist
          mv build/app/outputs/flutter-apk/app-release.apk dist/fluxdo-${{ matrix.arch }}-full.apk
          if ! unzip -l dist/fluxdo-${{ matrix.arch }}-full.apk | grep -q "lib/${{ matrix.arch }}/libdoh_proxy.so"; then
            echo "Full APK is missing libdoh_proxy.so"
            exit 1
          fi
          if ! unzip -l dist/fluxdo-${{ matrix.arch }}-full.apk | grep -q "lib/${{ matrix.arch }}/librhttp.so"; then
            echo "Full APK is missing librhttp.so"
            exit 1
          fi
          ls -lh dist/fluxdo-${{ matrix.arch }}-full.apk

      - name: Setup NuGet
        if: matrix.platform == 'windows'
        uses: nuget/setup-nuget@v2

      - name: Setup NASM
        if: matrix.platform == 'windows'
        uses: ilammy/setup-nasm@v1

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: |
          flutter build windows --release
          mkdir dist
          $releaseDir = "build\windows\x64\runner\Release"
          Copy-Item "core\doh_proxy\certs\ca.der" "$releaseDir\proxy_ca.der"

      - name: Package Windows ZIP
        if: matrix.platform == 'windows'
        run: |
          cd build\windows\x64\runner\Release
          7z a -tzip "..\..\..\..\..\dist\fluxdo-windows-x86_64.zip" .

      - name: Build Windows Installer
        if: matrix.platform == 'windows'
        run: |
          $version = "${{ needs.version.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version windows\setup.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}-${{ matrix.arch }}
          path: ./dist
          overwrite: true

  upload:
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la ./dist/

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          out="release_notes.md"
          current_tag="${{ needs.version.outputs.tag }}"
          previous_tag="${{ needs.version.outputs.previous_tag }}"

          > "$out"
          echo "Changes in $current_tag${previous_tag:+ since $previous_tag}" >> "$out"
          echo "" >> "$out"

          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..$current_tag"
          else
            range="$current_tag"
          fi

          git log --no-merges --pretty=format:"- %s%n" "$range" | \
            grep -v 'Update changelog' | \
            grep -v 'Co-Authored-By: Release Script' | \
            grep -v '^- chore: bump version to ' >> "$out" || true
          echo "" >> "$out"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ./release-assets
          mkdir -p ./release-assets

          required_assets=(
            "fluxdo-arm64-v8a-full.apk"
            "fluxdo-windows-x86_64-setup.exe"
            "fluxdo-windows-x86_64.zip"
          )

          for asset in "${required_assets[@]}"; do
            source="./dist/$asset"
            if [[ ! -f "$source" ]]; then
              echo "Missing required release asset: $asset"
              exit 1
            fi
            cp "$source" "./release-assets/$asset"
          done

          asset_count=$(find ./release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [[ "$asset_count" != "3" ]]; then
            echo "Release must contain exactly three installable assets."
            find ./release-assets -maxdepth 1 -type f -print
            exit 1
          fi

          ls -la ./release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            ./release-assets/fluxdo-arm64-v8a-full.apk
            ./release-assets/fluxdo-windows-x86_64-setup.exe
            ./release-assets/fluxdo-windows-x86_64.zip
          fail_on_unmatched_files: true
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
